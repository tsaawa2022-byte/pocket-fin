services:
  postgres:
    image: postgres:16-alpine
    container_name: pocketfin-postgres
    environment:
      POSTGRES_DB: pocketfin
      POSTGRES_USER: pocketfin
      POSTGRES_PASSWORD: pocketfin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pocketfin"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Добавляется на этапе деплоя backend:
  # backend:
  #   build: ../backend
  #   ports: ["8080:8080"]
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

volumes:
  pgdata:
