spring:
  application:
    name: pocket-fin-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pocketfin}
    username: ${DB_USER:pocketfin}
    password: ${DB_PASSWORD:pocketfin}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
